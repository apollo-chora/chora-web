<div
  class="cplus-stat-card"
  role="group"
  [attr.data-accent]="accent()"
  [attr.data-state]="state()"
  [attr.aria-label]="ariaLabel()"
>
  <span class="cplus-stat-card__label" aria-hidden="true">{{ label() }}</span>
  <span class="cplus-stat-card__value" aria-hidden="true">
    {{ displayValue() }}
  </span>
  @if (hint(); as h) {
    <span class="cplus-stat-card__hint" aria-hidden="true">{{ h }}</span>
  }
</div>
