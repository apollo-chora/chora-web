# chora-web nginx config — static SPA + API reverse proxy.
#
# Serves the Angular production bundle from /usr/share/nginx/html and
# reverse-proxies /api/* to the chora-gateway BFF so the browser only ever
# talks to one origin (no CORS, no mixed content).
#
# The gateway is expected at http://gateway:8080 inside the compose network
# (the compose service is named `gateway`). nginx does not do env-var
# substitution in the upstream block — point this at your BFF if your stack
# names it differently.

upstream chora_gateway {
    server gateway:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed, immutable assets — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must never be cached (it gates ngsw updates).
    location = /chora-service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API reverse proxy — the BFF gateway (JWT validation + tenant
    # stamping happen there; the mint endpoint is anonymous).
    location /api/ {
        proxy_pass http://chora_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # WebSocket realtime channel (ADR-183) — same gateway.
    location /ws/ {
        proxy_pass http://chora_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: every non-asset, non-API path serves index.html so
    // Angular's router owns client-side routing (deep links, refreshes).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
