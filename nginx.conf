# chora-web nginx config — static SPA + API reverse proxy.
#
# Serves the Angular production bundle from /usr/share/nginx/html and
# reverse-proxies /api/* to the chora-gateway BFF so the browser only ever
# talks to one origin (no CORS, no mixed content).
#
# The gateway is expected at http://gateway:8080 inside the compose network
# (the compose service is named `gateway`). Point this at your BFF if your
# stack names it differently.

server {
    listen 80;
    server_name _;

    # Resolve upstreams at request time via Docker's embedded DNS rather than
    # at config load: a startup-time lookup makes nginx exit when the gateway
    # container is not up yet, and compose start order is not guaranteed.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $chora_gateway http://gateway:8080;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed, immutable assets — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must never be cached (it gates ngsw updates).
    location = /chora-service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The entry document must revalidate so a new deploy is picked up even if
    # a browser cached it. Hashed JS/CSS stay immutable (see /assets/).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # API reverse proxy — the BFF gateway (JWT validation + tenant
    # stamping happen there; the mint endpoint is anonymous).
    location /api/ {
        # Atom authoring uploads source material as multipart (the SPA caps the
        # combined files at 32 MiB); nginx's 1 MB default 413s it first.
        client_max_body_size 40m;
        proxy_pass $chora_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # WebSocket realtime channel (ADR-183) — same gateway.
    location /ws/ {
        proxy_pass $chora_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: every non-asset, non-API path serves index.html so
    # Angular's router owns client-side routing (deep links, refreshes).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
